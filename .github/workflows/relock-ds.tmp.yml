name: relock-ds (temporário)

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meu-tema-sem-comprar-v3
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@rede-enois'
      - name: Remove the design-system entry from the lockfile
        run: |
          node -e "
            const fs = require('fs');
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            delete lock.packages['node_modules/@rede-enois/design-system'];
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          "
      - name: Re-resolve the lockfile against the published package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --package-lock-only --ignore-scripts
      - name: Show the resolved version
        run: node -e "const l=require('./package-lock.json');console.log(l.packages['node_modules/@rede-enois/design-system'].version, l.packages['node_modules/@rede-enois/design-system'].resolved)"
      - name: Commit the relocked file
        run: |
          git config user.name "melissa"
          git config user.email "amelissariver@gmail.com"
          git add package-lock.json
          git commit -m "chore(deps): relock do design system 0.40.2"
          git push
