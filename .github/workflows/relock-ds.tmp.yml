name: relock temporario

on:
  push:
    branches: [chore/deps-ds-0.45.0]

permissions:
  contents: write
  packages: read

jobs:
  relock:
    if: "!contains(github.event.head_commit.message, '[skip relock]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/deps-ds-0.45.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Regenerar o lock do design system 0.45.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install "@rede-enois/design-system@0.45.0" --save --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Conferir que o lock ficou na versao publicada
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const pkg = lock.packages["node_modules/@rede-enois/design-system"];
            if (!pkg) throw new Error("entrada do design system ausente no lock");
            if (pkg.version !== "0.45.0") throw new Error("versao no lock: " + pkg.version);
            if (!pkg.resolved || !pkg.integrity) throw new Error("resolved/integrity ausentes");
            console.log("lock ok:", pkg.version, pkg.resolved);
          '

      - name: Commitar o lock
        run: |
          git config user.name "relock"
          git config user.email "relock@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): lock do design system 0.45.0 [skip relock]"
          git push origin HEAD:chore/deps-ds-0.45.0

      - name: Remover o workflow temporario
        run: |
          git rm .github/workflows/relock-ds.tmp.yml
          git commit -m "chore(deps): remove workflow temporario de relock [skip relock]"
          git push origin HEAD:chore/deps-ds-0.45.0
