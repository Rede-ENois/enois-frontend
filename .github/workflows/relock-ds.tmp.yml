name: Reescrever lockfile do DS (temporário)
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: read
jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/enois-calendar-availability-screen
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@rede-enois"
      - name: Remove a entrada antiga do pacote para forçar resolução limpa
        run: python3 - <<'PY'
import json
p = "package-lock.json"
data = json.load(open(p))
data["packages"].pop("node_modules/@rede-enois/design-system", None)
data["dependencies"].pop("@rede-enois/design-system", None) if "dependencies" in data else None
json.dump(data, open(p, "w"), indent=2)
open(p, "a").write("\n")
PY
      - run: npm install --package-lock-only --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "melissa"
          git config user.email "melissa@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && echo "lockfile igual" || git commit -m "chore(deps): lockfile aponta o design-system 0.31.0 publicado"
          git push
