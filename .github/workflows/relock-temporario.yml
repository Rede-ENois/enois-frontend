name: Relock temporario

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: relock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/ds-0.38.1

      - name: Configurar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@rede-enois"

      - name: Relock do design system
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --package-lock-only --ignore-scripts
          grep -A3 'node_modules/@rede-enois/design-system' package-lock.json | head -4

      - name: Commitar o lock
        run: |
          git config user.name "relock-bot"
          git config user.email "relock-bot@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Nada a commitar: lock ja sincronizado"
            exit 0
          fi
          git commit -m "chore(deps): relock do design system 0.38.1"
          git push
