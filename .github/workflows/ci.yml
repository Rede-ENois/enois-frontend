name: CI

on:
  pull_request:
    # A linha do dia a dia e a `qa`: sem ela, os PRs da equipe entravam sem rodar teste nenhum.
    branches: [main, qa]
  push:
    branches: [main, qa]

permissions:
  contents: read
  # A TOKEN IS REQUIRED to install @rede-enois/design-system from GitHub Packages (even public
  # packages need one). `npm ci` gets this run's GITHUB_TOKEN; the package must grant this
  # repository read access in its settings ("Manage Actions access"), or it fails with E401.
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: rm -rf node_modules && npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A divida que travava estes passos foi paga (o lint e o typecheck passam limpos
      # nas duas linhas), entao eles rodam aqui de verdade: sem o typecheck, um campo que a
      # API devolve nulo passa e quebra no navegador.
      - name: Lint
        run: npm run lint

      # O baseline de lint (eslint-suppressions.json) congela a dívida antiga e só pode diminuir:
      # violação nova se corrige, não se esconde com `eslint --suppress-all`.
      - name: Baseline de lint só diminui
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          node scripts/check-lint-suppressions.mjs FETCH_HEAD

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Testes das regras do ESLint
        run: npm run test:eslint-rules
