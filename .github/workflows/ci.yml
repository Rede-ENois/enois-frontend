name: CI

on:
  pull_request:
    # A linha do dia a dia e a `qa`: sem ela, os PRs da equipe entravam sem rodar teste nenhum.
    branches: [main, qa]
  push:
    branches: [main, qa]

permissions:
  contents: read
  # A TOKEN IS REQUIRED to install @rede-enois/design-system from GitHub Packages (even public
  # packages need one). `npm ci` gets this run's GITHUB_TOKEN; the package must grant this
  # repository read access in its settings ("Manage Actions access"), or it fails with E401.
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: rm -rf node_modules && npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # O `npm ci` sai com 0 mesmo quando deixa de instalar uma dependência DIRETA do projeto
      # (já aconteceu: o design system, e aí o typecheck reprova o código que usa o pacote, longe
      # da causa). A guarda confere as dependências diretas da raiz e falha aqui, nomeando a que
      # faltou — em vez de deixar o erro aparecer como falha de tipo lá na frente.
      #
      # `npm ls --all` sozinho não serve para isso: a árvore traz centenas de `missing` de pacotes
      # `optional`/`peer` de outros pacotes (nada a ver com a instalação do projeto) e o motivo real
      # se perde no meio. O filtro é só nas `dependencies` da raiz — as que o `package.json` pede e
      # o `npm ci` tinha de instalar.
      - name: Guarda da instalação
        run: |
          npm ls --all --json > /tmp/arvore.json 2>/dev/null || true
          node -e '
            const arvore = require("/tmp/arvore.json");
            const raiz = arvore.dependencies ?? {};
            const faltando = Object.entries(raiz)
              .filter(([, no]) => no.missing)
              .map(([nome]) => nome);
            if (faltando.length) {
              console.error("Dependências diretas ausentes após o npm ci: " + faltando.join(", "));
              process.exit(1);
            }
            console.log("Instalação íntegra: todas as dependências diretas presentes.");
          '

      - name: Diagnóstico do baseline (temporário)
        run: |
          ls -la eslint-suppressions.json
          node -e "const d=require('./eslint-suppressions.json');console.log('entradas',Object.keys(d).length);console.log('apoiar',JSON.stringify(d['src/routes/apoiar.tsx']))"
          npx eslint --version
          npx eslint --print-config src/routes/apoiar.tsx | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const d=JSON.parse(s);console.log('regras',JSON.stringify(Object.fromEntries(Object.entries(d.rules).filter(([k])=>k.includes('front-markup')||k==='no-restricted-syntax'))));console.log('linterOptions',JSON.stringify(d.linterOptions))})"
          npx eslint . > /tmp/lint.txt 2>&1 || true
          grep -c "no-front-markup" /tmp/lint.txt || true
          sed -n '1,40p' /tmp/lint.txt

      # A divida que travava estes passos foi paga (o lint e o typecheck passam limpos
      # nas duas linhas), entao eles rodam aqui de verdade: sem o typecheck, um campo que a
      # API devolve nulo passa e quebra no navegador.
      - name: Lint
        run: npm run lint

      # O baseline de lint (eslint-suppressions.json) congela a dívida antiga e só pode diminuir:
      # violação nova se corrige, não se esconde com `eslint --suppress-all`.
      - name: Baseline de lint só diminui
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          node scripts/check-lint-suppressions.mjs FETCH_HEAD

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Testes das regras do ESLint
        run: npm run test:eslint-rules
