name: PR Checks Comment

# Companheiro do pr-checks.yml. Comentar na PR exige escrita, e o job que lê o título (dado da PR,
# possivelmente de fork) nunca carrega esse token. Este workflow roda no contexto da base depois que
# o PR Checks termina e só lê do artefato um número de PR, validado antes de usar.
on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Baixar o número da PR reprovada
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: pr-title-failure
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Avisar na PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            if (!fs.existsSync("pr-number.txt")) return;
            const raw = fs.readFileSync("pr-number.txt", "utf8").trim();
            if (!/^[1-9]\d{0,9}$/.test(raw)) {
              core.warning("Número de PR inválido no artefato; nada publicado.");
              return;
            }
            const issue_number = Number(raw);
            const { owner, repo } = context.repo;

            // A PR precisa ser a mesma que disparou a execução reprovada.
            const pulls = context.payload.workflow_run.pull_requests ?? [];
            if (pulls.length && !pulls.some((p) => p.number === issue_number)) {
              core.warning("O artefato aponta para outra PR; nada publicado.");
              return;
            }

            const marker = "<!-- pr-checks:titulo -->";
            const body = [
              marker,
              "**Título da PR fora do padrão Conventional Commits**",
              "",
              "O título segue o formato `tipo(escopo): descrição` e alimenta a versão e o CHANGELOG",
              "gerados pelo Release Please.",
              "",
              "Exemplos: `feat(feed): mostra a prévia do link`, `fix(mensagens): corrige o scroll`,",
              "`docs: atualiza o README`. Ajuste o título para o check passar.",
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            if (!comments.some((c) => c.body?.startsWith(marker))) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
