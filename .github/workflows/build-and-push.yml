name: Build, Push and Deploy

# SECURITY — read before editing this file:
# This repo is public. The self-hosted runner (labels: self-hosted, enois, docker-prod4)
# has NO docker.sock mount and only talks to Portainer's HTTP API with scoped credentials.
# It must NEVER be targeted by a job that runs on `pull_request` — a fork PR would then
# execute arbitrary workflow code with access to our infra ("pwn request"). The deploy job
# below is gated to `push`/`workflow_dispatch` on protected branches only. PR validation
# always runs on GitHub-hosted `ubuntu-24.04` and never touches secrets.

on:
  push:
    branches:
      - main
      - qa
  pull_request:
    branches:
      - main
      - qa
  workflow_dispatch:

# One deploy per branch at a time, newest wins: two merges seconds apart used to race and the
# older commit's deploy could finish last, leaving qa on the previous build.
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  HARBOR_REGISTRY: harbor.b7cloud.top
  HARBOR_PROJECT: enois
  IMAGE_NAME: frontend
  CONTAINER_NAME: enois-qa-frontend
  PORTAINER_ENDPOINT_ID: 8
  # Baked at build time into the Vite/Nitro bundle — NOT a runtime env var.
  # Changing this for a running container requires a rebuild, not just a redeploy.
  # (This exact gotcha took the AWS deploy down once — see Dockerfile comment.)
  VITE_API_BACKEND_QA: https://enois-api-qa.b7cloud.tech/api
  # Origem pública que o SSR declara ao backend (X-Client-Origin). Precisa ser a origem da QA:
  # o backend só aceita origens da allowlist (CORS_ALLOWED_ORIGINS=https://enois-qa.b7cloud.tech).
  VITE_SITE_URL_QA: https://enois-qa.b7cloud.tech
  VITE_API_BACKEND_PROD: https://api.enois.ia.br/api
  VITE_SITE_URL_PROD: https://enois.ia.br

permissions:
  contents: read
  # A TOKEN IS REQUIRED to install @rede-enois/design-system: GitHub Packages asks for one even for
  # public packages. The Docker builds get this run's GITHUB_TOKEN (read-only on packages, and
  # read-only everywhere on fork PRs) as the `npm_token` build secret. The package must grant this
  # repository read access in its settings ("Manage Actions access"), or `npm ci` fails with E401.
  packages: read

jobs:
  # ===========================================================================
  # Validação de build em PR (sempre hosted, nunca self-hosted, sem credenciais)
  # ===========================================================================
  validate-pr-build:
    name: 🧪 Validar build (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🧪 Build sem push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enois/frontend:pr-check
          build-args: |
            VITE_API_BACKEND=${{ env.VITE_API_BACKEND_QA }}
            VITE_SITE_URL=${{ env.VITE_SITE_URL_QA }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Build + Push para Harbor (push/workflow_dispatch em main ou qa, hosted runner)
  # ===========================================================================
  build-and-push:
    name: 🐳 Build & Push → Harbor
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      branch: ${{ steps.vars.outputs.branch }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Contexts go through env, never interpolated into the script text.
      - name: 🏷️ Definir tags
        id: vars
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHA_SHORT=$(echo "${COMMIT_SHA}" | cut -c1-7)
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${BRANCH}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🔑 Login no Harbor
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # A poda vem ANTES do build: o push é o que esbarra na cota, então limpar depois seria
      # tarde demais — e, com o registro cheio, o push falha e a poda nunca roda (foi assim que a
      # QA ficou horas sem receber código). Limpando primeiro, este build tem espaço para subir.
      #
      # Mantém prod atual + 1 backup, a tag `main`, a QA mais recente e a tag deste build; apaga
      # o resto. Não derruba a run: uma falha aqui não pode impedir o deploy de um build válido.
      - name: 🧹 Podar imagens antigas no Harbor
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          CURRENT_TAG: ${{ steps.vars.outputs.image_tag }}
          KEEP_PROD: "2"
        run: |
          if ! bash .github/scripts/harbor-retention.sh; then
            echo "::warning::A poda do Harbor falhou; este build segue, mas o registro não foi limpo."
          fi

      - name: 🏷️ Definir build-args por branch
        id: buildargs
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          if [ "${BRANCH}" = "main" ]; then
            echo "api_backend=${VITE_API_BACKEND_PROD}" >> "$GITHUB_OUTPUT"
            echo "site_url=${VITE_SITE_URL_PROD}" >> "$GITHUB_OUTPUT"
          else
            echo "api_backend=${VITE_API_BACKEND_QA}" >> "$GITHUB_OUTPUT"
            echo "site_url=${VITE_SITE_URL_QA}" >> "$GITHUB_OUTPUT"
          fi

      # push:true direto no buildx (buildkit) dá 400 no token service do Harbor com
      # multi-tag num push só (bug conhecido buildkit x Harbor 2.11 — não é bug nosso,
      # não tocar na config do Harbor, que funciona normal pras pipes do GitLab).
      # Fix: build local (load) + docker push classico por tag, igual ao fluxo do GitLab.
      - name: 🚀 Build (local, sem push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            VITE_API_BACKEND=${{ steps.buildargs.outputs.api_backend }}
            VITE_SITE_URL=${{ steps.buildargs.outputs.site_url }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📤 Push para Harbor (docker push classico, tag por tag)
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          set -euo pipefail
          IMG="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}"
          # Toda build publica a tag do commit. Produção publica também a flutuante `main`, que é
          # a única flutuante mantida: serve para apontar sempre para o último build de prod. A
          # QA não tem flutuante — quem sobe lá é a tag do commit, e a flutuante antiga só ficava
          # parada ocupando a cota.
          docker push "${IMG}:${IMAGE_TAG}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker tag "${IMG}:${IMAGE_TAG}" "${IMG}:main"
            docker push "${IMG}:main"
          fi

      # ===========================================================================
  # Deploy QA — SOMENTE branch qa, SOMENTE push/workflow_dispatch, self-hosted
  # ===========================================================================
  deploy-qa:
    name: 🚢 Deploy → QA (docker-prod4)
    needs: build-and-push
    if: >
      needs.build-and-push.outputs.branch == 'qa' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, enois, docker-prod4]
    # Dois pushes em sequência não podem trocar o container um por cima do outro.
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: 🚢 Recriar container via Portainer API
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          IMAGE_REF: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          API="${PORTAINER_BASE_URL}/api/endpoints/${PORTAINER_ENDPOINT_ID}/docker"
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          NEW_NAME="${CONTAINER_NAME}-new"
          PREV_NAME="${CONTAINER_NAME}-previous"
          IMG_PATH="${IMAGE_REF%:*}"
          IMG_TAG="${IMAGE_REF##*:}"

          # Chamada ao proxy Docker do Portainer: imprime o corpo só quando dá certo e, quando
          # falha, mostra status + começo do corpo (sem despejar o progresso inteiro do pull).
          call() {
            local method="$1" path="$2" out status
            shift 2
            out="$(mktemp)"
            status="$(curl -sS -o "${out}" -w '%{http_code}' --connect-timeout 10 --max-time 60 \
              -X "${method}" "${AUTH[@]}" "$@" "${API}${path}")" || status="000"
            if [[ "${status}" != 2* ]]; then
              echo "!! ${method} ${path} -> HTTP ${status}" >&2
              head -c 600 "${out}" >&2 || true
              echo >&2
              rm -f "${out}"
              return 1
            fi
            cat "${out}"
            rm -f "${out}"
          }

          status_of() {
            local method="$1" path="$2"
            shift 2
            curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 60 \
              -X "${method}" "${AUTH[@]}" "$@" "${API}${path}" 2>/dev/null || echo 000
          }

          # 1) Espaço no Docker do host. Cada deploy baixa uma imagem nova de frontend e a antiga
          #    fica para sempre; a poda do Harbor limpa o REGISTRO, não o disco desta máquina, e
          #    o runner não tem docker.sock — daí a limpeza passar pelo proxy do Portainer.
          if call GET /system/df > /tmp/enois-df.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          d = json.load(open("/tmp/enois-df.json"))
          def mb(n): return f"{(n or 0) / 1048576:.0f} MB"
          imgs = sum((i.get("Size") or 0) - (i.get("SharedSize") or 0) for i in d.get("Images") or [])
          vols = sum(((v.get("UsageData") or {}).get("Size") or 0) for v in d.get("Volumes") or [])
          print(f"==> Docker do host: imagens ~{mb(imgs)} | volumes ~{mb(vols)}")
          PY
          else
            echo "::warning::não consegui ler o uso de disco do Docker (segue o deploy)"
          fi

          # Só builds de QA aposentados: `main` é o deploy de produção (e o Docker buscaria a
          # tag de novo no próximo deploy), e uma imagem em uso nunca deve ser apagada.
          echo "==> Removendo imagens aposentadas de ${IMAGE_NAME}:qa-* (a deste build fica)"
          if call GET /images/json > /tmp/enois-images.json 2>/dev/null; then
            python3 - "${IMAGE_REF}" "${IMG_PATH}:qa-" > /tmp/enois-old-tags.txt <<'PY'
          import json, sys
          current, prefix = sys.argv[1], sys.argv[2]
          for img in json.load(open("/tmp/enois-images.json")):
              if (img.get("Containers") or 0) > 0:
                  continue
              for tag in img.get("RepoTags") or []:
                  if tag.startswith(prefix) and tag != current:
                      print(tag)
          PY
            removed=0
            kept=0
            while IFS= read -r tag; do
              [[ -z "${tag}" ]] && continue
              if status_of DELETE "/images/${tag}?force=0&noprune=1" | grep -qE '^2'; then
                removed=$((removed + 1))
                echo "   removida: ${tag#*/}"
              else
                kept=$((kept + 1))
              fi
            done < /tmp/enois-old-tags.txt
            echo "==> ${removed} tag(s) removida(s), ${kept} ainda em uso"
          else
            echo "::warning::não consegui listar as imagens (segue o deploy)"
          fi

          # 2) Pull ANTES de mexer no que está no ar. O Docker devolve 200 mesmo quando a extração
          #    falha no meio do stream, então o erro é procurado no corpo — sem isso o passo
          #    seguia, parava e apagava o container bom para depois falhar no create.
          echo "==> Pull ${IMAGE_REF}"
          ENCODED_IMAGE=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['IMAGE_REF'].rsplit(':',1)[0]))")
          # projeto 'enois' e privado no Harbor -> precisa de X-Registry-Auth no pull via Portainer
          REGISTRY_AUTH=$(python3 -c "import json,base64,os;print(base64.b64encode(json.dumps({'username':os.environ['HARBOR_USER'],'password':os.environ['HARBOR_PASSWORD'],'serveraddress':'${HARBOR_REGISTRY}'}).encode()).decode())")
          PULL_OUT=$(mktemp)
          PULL_STATUS=$(curl -sS -o "${PULL_OUT}" -w '%{http_code}' --connect-timeout 10 --max-time 600 \
            -X POST "${AUTH[@]}" -H "X-Registry-Auth: ${REGISTRY_AUTH}" \
            "${API}/images/create?fromImage=${ENCODED_IMAGE}&tag=${IMG_TAG}") || PULL_STATUS="000"
          if [[ "${PULL_STATUS}" != 2* ]] || grep -q '"error"' "${PULL_OUT}"; then
            echo "!! pull falhou (HTTP ${PULL_STATUS})"
            tail -c 800 "${PULL_OUT}" | tr -d '\r'
            echo
            echo "==> O container atual NÃO foi tocado."
            rm -f "${PULL_OUT}"
            exit 1
          fi
          tail -c 200 "${PULL_OUT}" | tr -d '\r'
          echo
          rm -f "${PULL_OUT}"

          # 3) Cria o novo SEM parar o atual: a porta só é disputada no start, então uma falha
          #    aqui deixa o container que está servindo intacto.
          echo "==> Criando ${NEW_NAME} (o atual segue no ar)"
          status_of DELETE "/containers/${NEW_NAME}?force=1" >/dev/null || true
          status_of DELETE "/containers/${PREV_NAME}?force=1" >/dev/null || true

          echo "==> Criar container novo"
          cat > /tmp/enois-frontend-deploy.json <<EOF
          {
            "Image": "${IMAGE_REF}",
            "Env": ["PORT=3000", "NODE_ENV=production"],
            "ExposedPorts": {"3000/tcp": {}},
            "HostConfig": {
              "RestartPolicy": {"Name": "unless-stopped"},
              "Memory": 536870912,
              "MemorySwap": 536870912,
              "MemoryReservation": 268435456,
              "PortBindings": {"3000/tcp": [{"HostPort": "8106"}]}
            }
          }
          EOF

          if ! call POST "/containers/create?name=${NEW_NAME}" \
              -H "Content-Type: application/json" -d @/tmp/enois-frontend-deploy.json > /tmp/enois-create.json; then
            echo "==> O container atual NÃO foi tocado."
            exit 1
          fi
          echo "   criado: $(python3 -c 'import json;print(json.load(open("/tmp/enois-create.json")).get("Id","?")[:12])')"

          # 4) Troca: para o atual, guarda como `-previous` e promove o novo. Qualquer falha
          #    devolve o anterior ao nome original e o sobe de novo.
          echo "==> Trocando para o novo"
          STOP_STATUS=$(status_of POST "/containers/${CONTAINER_NAME}/stop?t=20")
          case "${STOP_STATUS}" in
            204|304|404) ;;
            *)
              echo "!! não consegui parar ${CONTAINER_NAME} (HTTP ${STOP_STATUS}); nada foi trocado"
              status_of DELETE "/containers/${NEW_NAME}?force=1" >/dev/null || true
              exit 1
              ;;
          esac

          PREV_SAVED=0
          RENAME_STATUS=$(status_of POST "/containers/${CONTAINER_NAME}/rename?name=${PREV_NAME}")
          case "${RENAME_STATUS}" in
            204) PREV_SAVED=1 ;;
            404) echo "   (não havia container anterior)" ;;
            *)
              echo "!! não consegui renomear o container atual (HTTP ${RENAME_STATUS})"
              status_of POST "/containers/${CONTAINER_NAME}/start" >/dev/null || true
              status_of DELETE "/containers/${NEW_NAME}?force=1" >/dev/null || true
              exit 1
              ;;
          esac

          restaurar() {
            echo "==> Rollback: devolvendo ${PREV_NAME} para ${CONTAINER_NAME}"
            status_of DELETE "/containers/${CONTAINER_NAME}?force=1" >/dev/null || true
            status_of POST "/containers/${PREV_NAME}/rename?name=${CONTAINER_NAME}" >/dev/null || true
            status_of POST "/containers/${CONTAINER_NAME}/start" >/dev/null || true
          }

          if [[ "$(status_of POST "/containers/${NEW_NAME}/rename?name=${CONTAINER_NAME}")" != "204" ]]; then
            echo "!! não consegui promover o novo container"
            if [[ ${PREV_SAVED} -eq 1 ]]; then
              restaurar
            fi
            exit 1
          fi

          START_STATUS=$(status_of POST "/containers/${CONTAINER_NAME}/start")
          case "${START_STATUS}" in
            204|304) ;;
            *)
              echo "!! start do novo container falhou (HTTP ${START_STATUS})"
              if [[ ${PREV_SAVED} -eq 1 ]]; then
                restaurar
              fi
              exit 1
              ;;
          esac
          echo "==> Container novo no ar com ${IMAGE_REF}"
          if [[ ${PREV_SAVED} -eq 1 ]]; then
            echo "   anterior guardado como ${PREV_NAME} até o health check"
          fi

      - name: 🩺 Health check
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -uo pipefail
          API="${PORTAINER_BASE_URL}/api/endpoints/${PORTAINER_ENDPOINT_ID}/docker"
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          status_of() {
            local method="$1" path="$2"
            shift 2
            curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 60 \
              -X "${method}" "${AUTH[@]}" "$@" "${API}${path}" 2>/dev/null || echo 000
          }

          # `curl | head` hid every failure (no pipefail): a 500 on every page passed as healthy.
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null --max-time 10 https://enois-qa.b7cloud.tech/feed; then
              echo "OK na tentativa $i"
              # Subiu: o container anterior guardado deixa de ser necessário.
              status_of DELETE "/containers/${CONTAINER_NAME}-previous?force=1" >/dev/null || true
              exit 0
            fi
            echo "tentativa $i falhou, aguardando..."
            sleep 5
          done

          # O novo não subiu: devolve o anterior ao nome original em vez de deixar a QA fora.
          if [[ "$(status_of GET "/containers/${CONTAINER_NAME}-previous/json")" == "200" ]]; then
            echo "=== rollback para o container anterior ==="
            status_of DELETE "/containers/${CONTAINER_NAME}?force=1" >/dev/null || true
            status_of POST "/containers/${CONTAINER_NAME}-previous/rename?name=${CONTAINER_NAME}" >/dev/null || true
            status_of POST "/containers/${CONTAINER_NAME}/start" >/dev/null || true
          fi
          echo "health check nao respondeu apos 75s"
          exit 1

  # ===========================================================================
  # Deploy PROD — SOMENTE branch main, SOMENTE push/workflow_dispatch, self-hosted
  # ===========================================================================
  deploy-prod:
    name: 🚢 Deploy → PROD (enois-node1)
    needs: build-and-push
    if: >
      needs.build-and-push.outputs.branch == 'main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, enois, docker-prod4]
    steps:
      # Deploy sempre via Portainer STACK (nunca container avulso via /containers/create).
      # Stack "enois-prod-frontend" (id 352) no endpoint 10 (enois-node1), criada em 2026-10-23
      # convertendo o container avulso que ja rodava (zero downtime). PUT /stacks/{id} atualiza
      # o StackFileContent com a tag de imagem nova e faz o Portainer recriar o container.
      - name: 🚢 Atualizar stack via Portainer API (endpoint enois-node1)
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID_PROD: 10
          PROD_STACK_ID: 352
          IMAGE_REF: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")

          echo "==> Gerar docker-compose da stack com a imagem atual"
          cat > /tmp/enois-prod-frontend-stack.yml <<EOF
          version: "3.8"
          services:
            frontend:
              image: ${IMAGE_REF}
              container_name: enois-prod-frontend
              restart: unless-stopped
              # enois-node1 e dedicado exclusivamente a este projeto (6 vCPU/11.67GB), so roda
              # este container. Limite anterior era 512MB/256MB (curto pra SSR Node/Nitro).
              mem_limit: 2g
              mem_reservation: 1g
              memswap_limit: 2g
              environment:
                PORT: "3000"
                NODE_ENV: production
              ports:
                - "8106:3000"
          EOF

          echo "==> Montar payload JSON (python escapa o YAML certo pro body)"
          python3 -c "
          import json
          with open('/tmp/enois-prod-frontend-stack.yml') as f:
              content = f.read()
          payload = {'stackFileContent': content, 'env': [], 'prune': True, 'pullImage': True}
          with open('/tmp/stack-update-payload.json', 'w') as f:
              json.dump(payload, f)
          "

          echo "==> PUT /stacks/${PROD_STACK_ID} (endpointId=${PORTAINER_ENDPOINT_ID_PROD})"
          curl -sf -X PUT "${AUTH[@]}" -H "Content-Type: application/json" \
            "${PORTAINER_BASE_URL}/api/stacks/${PROD_STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID_PROD}" \
            -d @/tmp/stack-update-payload.json

      - name: 🩺 Health check
        run: |
          for i in $(seq 1 15); do
            if curl -sf --max-time 10 https://enois.ia.br; then
              echo "OK na tentativa $i"
              exit 0
            fi
            echo "tentativa $i falhou, aguardando..."
            sleep 5
          done
          echo "health check nao respondeu apos 75s"
          exit 1
