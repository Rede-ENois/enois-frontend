name: Sonda do lock do design system (descartável)

# TEMPORÁRIO: só para descobrir a integridade real do tarball do design system publicado, que o
# npm desta máquina não consegue ler (401 sem read:packages). Baixa o tarball com o GITHUB_TOKEN do
# CI, imprime a integridade e compara com o lock da branch. Dispara por push numa branch
# descartável (`sonda/lock-ds`), porque `workflow_dispatch` só existe para workflows na main.
# Apagar depois.

on:
  push:
    branches: [sonda/lock-ds]

permissions:
  contents: read
  packages: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar o tarball e comparar com o lock
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc-sonda
          npm config --userconfig .npmrc-sonda pack @rede-enois/design-system@0.46.7 --pack-destination .
          tarball="$(ls rede-enois-design-system-0.46.7.tgz)"
          integridade="$(node .github/scripts/integridade-pacote.mjs "$tarball")"
          echo "integridade calculada: $integridade"
          node -e '
            const d = require("./package-lock.json").packages["node_modules/@rede-enois/design-system"];
            console.log("lock:", d.version, d.resolved);
          '
          echo "bate: $(node -e 'console.log(require("./package-lock.json").packages["node_modules/@rede-enois/design-system"].integrity === process.argv[1])' "$integridade")"
