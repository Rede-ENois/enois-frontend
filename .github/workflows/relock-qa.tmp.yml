name: relock temporario

on:
  push:
    branches: [fix/desafios-tela-inteira]

permissions:
  contents: write
  packages: read

jobs:
  relock:
    if: "!contains(github.event.head_commit.message, '[skip relock]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desafios-tela-inteira

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Regenerar o lock do design system 0.46.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install "@rede-enois/design-system@0.46.0" --save --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Conferir que o lock ficou na versao pedida
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const e = lock.packages["node_modules/@rede-enois/design-system"];
            if (!e || e.version !== "0.46.0") throw new Error("lock fora da 0.46.0: " + JSON.stringify(e));
            if (!e.resolved || !e.integrity) throw new Error("faltou resolved/integrity");
            console.log("lock ok:", e.version, e.resolved);
          '

      - name: Commitar o lock
        run: |
          git config user.name "relock"
          git config user.email "relock@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): lock do design system 0.46.0 [skip relock]"
          git push origin HEAD:fix/desafios-tela-inteira
