name: Sugerir uma melhoria
description: Uma ideia de funcionalidade ou de ajuste na interface
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que problema isso resolve
      description: Descreva a situação de quem usa, não a solução técnica.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: O que você imagina
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
    validations:
      required: false
  - type: textarea
    id: plano
    attributes:
      label: Plano de implementação
      description: >
        Qual view nasce no design system, qual container fica no front, quais casos-limite precisam
        de teste e como a entrega será provada. A PR desta feature referencia esta issue.
    validations:
      required: true
  - type: textarea
    id: prova
    attributes:
      label: Como vai ser provado
      description: Qual teste novo, qual teste de regressão, o que será conferido no navegador (viewport e tema).
    validations:
      required: true
