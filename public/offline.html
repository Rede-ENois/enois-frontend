<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7c38ee" />
    <title>Sem conexão · Énóis</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family:
          "Manrope",
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        background: linear-gradient(135deg, #773cd6, #ba73ea);
        color: #fff;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.16);
        display: grid;
        place-items: center;
        font-size: 34px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.5;
        opacity: 0.85;
      }
      button {
        border: 0;
        cursor: pointer;
        border-radius: 999px;
        padding: 10px 28px;
        font: inherit;
        font-weight: 600;
        color: #773cd6;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">✨</div>
      <h1>Você está offline</h1>
      <p>Não conseguimos falar com o servidor. Verifique sua conexão e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
